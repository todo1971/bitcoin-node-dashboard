server=1
listen=1
bind=0.0.0.0:8333
port=8333
maxconnections=64

# RPC is reachable only on the private Compose network; port 8332 is not
# published on the host.
rpcbind=0.0.0.0
rpcallowip=172.30.0.0/24
rpcport=8332

prune=20000
dbcache=256
par=2
disablewallet=1

upnp=0
natpmp=0
debug=0
logtimestamps=1
printtoconsole=1
