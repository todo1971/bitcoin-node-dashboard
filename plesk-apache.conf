# In Plesk under: Domains > your subdomain > Apache & nginx Settings
# Paste into "Additional Apache directives" for HTTP and HTTPS.
ProxyPreserveHost On
ProxyPass        / http://127.0.0.1:8787/ connectiontimeout=5 timeout=900
ProxyPassReverse / http://127.0.0.1:8787/

# Optional: only allow a trusted public IP.
