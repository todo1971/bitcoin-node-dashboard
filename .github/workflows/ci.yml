name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile app.py installer/web_installer.py
      - name: Shell syntax
        run: |
          sh -n installer/bootstrap-admin.sh installer/update-bitcoin-dashboard installer/update-bitcoin-core
          sh -n installer/install-docker-all-in-one.sh
          bash -n docker/all-in-one-entrypoint.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bilingual documentation
        run: python tools/check_documentation.py
      - name: Validate Docker Compose files
        env:
          PUBLIC_NODE_ADDRESS: 127.0.0.1
          ADMIN_TOKEN: 01234567890123456789012345678901
        run: |
          docker compose config --quiet
          docker compose -f compose.host-node.yaml config --quiet
          docker compose -f compose.all-in-one.yaml config --quiet
      - name: Build dashboard container
        run: docker build --build-arg APP_VERSION=ci -t bitcoin-node-dashboard:ci .
      - name: Build all-in-one container
        env:
          PUBLIC_NODE_ADDRESS: 127.0.0.1
          ADMIN_TOKEN: 01234567890123456789012345678901
        run: docker compose -f compose.all-in-one.yaml build
      - name: Validate shell installer
        run: |
          sudo sh installer/install-docker-all-in-one.sh \
            --public-address 127.0.0.1 \
            --install-dir /opt/bitcoin-node-dashboard-ci \
            --prepare-only
          sudo test -f /opt/bitcoin-node-dashboard-ci/.env
          sudo test "$(stat -c %a /opt/bitcoin-node-dashboard-ci/.env)" = 600
      - name: Smoke-test all-in-one container
        env:
          PUBLIC_NODE_ADDRESS: 127.0.0.1
          ADMIN_TOKEN: 01234567890123456789012345678901
        run: |
          docker compose -f compose.all-in-one.yaml up -d --no-build
          container_id=$(docker compose -f compose.all-in-one.yaml ps -q node)
          timeout 150 bash -c "until [ \"\$(docker inspect --format '{{.State.Health.Status}}' '$container_id')\" = healthy ]; do sleep 2; done"
          curl --fail --silent --show-error http://127.0.0.1:8787/healthz
          curl --fail --silent --show-error http://127.0.0.1:8787/static/locales/en.json > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/admin)" = 401
      - name: Smoke-test separate-container stack
        env:
          PUBLIC_NODE_ADDRESS: 127.0.0.1
          ADMIN_TOKEN: 01234567890123456789012345678901
        run: |
          docker compose -f compose.all-in-one.yaml down
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8787/healthz
          curl --fail --silent --show-error http://127.0.0.1:8787/static/locales/en.json > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/admin)" = 401
      - name: Clean up all-in-one smoke test
        if: always()
        env:
          PUBLIC_NODE_ADDRESS: 127.0.0.1
          ADMIN_TOKEN: 01234567890123456789012345678901
        run: |
          docker compose -f compose.all-in-one.yaml logs --tail 100 || true
          docker compose -f compose.all-in-one.yaml down -v
          docker compose logs --tail 100 || true
          docker compose down -v
